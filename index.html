  showModal('<form id="pf" class="mform" data-id="'+esc(id||'')+'" data-tid="t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+'" novalidate><h2>'+(p?'Sửa sản phẩm / nhập thêm hàng':'Thêm sản phẩm')+'</h2>'+
   '<label class="fld">Tên sản phẩm<input id="pf-name" maxlength="60" value="'+esc(v('name',''))+'" placeholder="Coca-Cola 330 ml"></label>'+
   '<div class="row2"><label class="fld">Số lượng nhập (thùng)<input id="pf-qty" type="number" inputmode="decimal" min="0" step="any" placeholder="2"></label><label class="fld">Giá nhập 1 thùng (đ)<input id="pf-nhap" type="text" class="mi" inputmode="numeric" value="'+(p?fm(Math.round(p.giaNhap*24)):'')+'" placeholder="240.000"></label></div>'+
   '<p style="color:var(--ink2);margin:-4px 0 0">Quy ước: <b>1 thùng = 24 '+esc(u)+'</b></p><div class="tealbox" id="pf-prev"></div>'+
   '<div class="row2"><label class="fld">Giá bán (đ/'+esc(u)+')<input id="pf-ban" type="text" class="mi" inputmode="numeric" value="'+fm(v('giaBan',''))+'"></label><label class="fld">Mức tồn tối thiểu ('+esc(u)+')<input id="pf-min" type="number" inputmode="numeric" min="0" value="'+v('tonToiThieu',24)+'"></label></div>'+
   '<label class="fld">Tồn đầu ('+esc(u)+' đã có sẵn trước khi bắt đầu dùng sổ)<input id="pf-ton" type="number" inputmode="numeric" min="0" value="'+v('tonDau',0)+'"></label>'+
   '<div class="err" role="alert"></div><div class="mact"><button type="button" class="btn" data-act="close">Hủy</button><button type="submit" class="btn sell" data-act="save">'+(p?'Lưu':'Lưu sản phẩm')+'</button></div></form>');pfPrev()}
function pfPrev(){const f=$('#pf');if(!f)return;const id=f.dataset.id,u=id&&prod(id)?prod(id).unit:'lon',qs=$('#pf-qty').value,gs=$('#pf-nhap').value,q=+qs,g=pn(gs),ban=pn($('#pf-ban').value)||0;
  if(gs===''||!(g>=0)){$('#pf-prev').innerHTML='Nhập số thùng và giá nhập 1 thùng để xem quy đổi.';return}
  const per=g/24;let h='';
  if(qs!==''&&q>0)h+='Số lượng nhập: <b>'+num(q)+' thùng</b> · Giá nhập: <b>'+money(g)+'/thùng</b><br>Quy đổi: <b>'+num(q*24)+' '+esc(u)+'</b> · Giá nhập: <b>'+money(per)+'/'+esc(u)+'</b><br>Tổng tiền nhập: <b>'+money(q*g)+'</b>';
  else h+='Giá nhập: <b>'+money(g)+'/thùng</b> → <b>'+money(per)+'/'+esc(u)+'</b> (chưa nhập thêm hàng)';
  if(ban>0)h+='<br>Lãi mỗi '+esc(u)+': <b>'+money(ban-per)+'</b>';$('#pf-prev').innerHTML=h}
function submitProd(f){const g=i=>$('#'+i).value,er=$('#modal .err'),id=f.dataset.id,old=id?prod(id):null,unit=old?old.unit:'lon';
  const q=g('pf-qty')===''?0:+g('pf-qty'),thung=Math.round(pn(g('pf-nhap'))),gn=thung/24,sl=Math.round(q*24);
  const v={name:g('pf-name').trim(),unit,giaNhap:gn,giaCost:gn,giaThung:thung,giaBan:Math.round(pn(g('pf-ban'))),tonDau:Math.floor(+g('pf-ton')||0),qThung:24,qLoc:6,tonToiThieu:Math.floor(+g('pf-min')||0)};
  if(!v.name){er.textContent='Nhập tên sản phẩm.';return}
  if(isNaN(thung)||thung<0||g('pf-nhap')===''){er.textContent='Nhập giá nhập 1 thùng.';return}
  if(isNaN(v.giaBan)||v.giaBan<0){er.textContent='Nhập giá bán (đ/'+unit+').';return}
  if(isNaN(q)||q<0||Math.abs(q*24-sl)>1e-9){er.textContent='Số thùng nhập phải cho ra số '+unit+' nguyên (1 thùng = 24).';return}
  if(q>0&&!(thung>0)){er.textContent='Nhập giá nhập 1 thùng lớn hơn 0.';return}
  v.tonDauGia=old&&old.tonDauGia!=null?old.tonDauGia:gn;
  const pid=id||'p'+Date.now().toString(36),date=defDate(route()),tid=f.dataset.tid,by=uname()||'Nhân viên';
  commit(async()=>{await dbh.collection('products').doc(pid).set(v);
    if(sl>0){const cur=(cloud.days.get(date)||[]);
      if(!cur.some(l=>l.pid===tid)){const code=ma('nhap',date,tickets().filter(t=>t.date===date&&t.loai==='nhap').length+1);
        await dbh.collection('days').doc(date).set({d:date,lines:cur.concat([{id:newId(),pid:tid,ma:code,time:nowIso(),user:by,loai:'nhap',sp:pid,sl,gia:gn,cost:gn,dv:'thung',dvSl:q,thung:q}])})}}},
    sl>0?'Đã lưu '+v.name+' và nhập '+num(q)+' thùng ('+num(sl)+' '+unit+') vào kho.':'Đã lưu '+v.name+'.')}
function delProd(id){if(state.lines.some(l=>l.sp===id)){toast('Sản phẩm đã có giao dịch nên không xóa được.',true);return}run(async()=>{await dbh.collection('products').doc(id).delete();toast('Đã xóa sản phẩm.')}).catch(e=>toast('Không lưu được: '+e.message,true))}
function arm(b,fn){if(b.dataset.armed){fn();return}b.dataset.armed='1';const o=b.textContent;b.textContent='Bấm lần nữa';b.classList.add('danger');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o;b.classList.remove('danger')}},3500)}
function seed(){if(!dbh)return;const s=makeSample();run(async()=>{for(const p of s.products){const o=Object.assign({},p);delete o.id;await dbh.collection('products').doc(p.id).set(o)}for(const[d,ls]of s.days)await dbh.collection('days').doc(d).set({d,lines:ls});await dbh.doc('meta/app').set({mode:'sample',started:nowIso()});toast('Đã nạp dữ liệu mẫu.')}).catch(e=>toast('Không lưu được: '+e.message,true))}
function startReal(){if(!dbh)return;run(async()=>{await dbh.doc('meta/app').set({mode:'real',started:nowIso()});toast('Kho trống đã sẵn sàng. Hãy thêm sản phẩm.');location.hash='#san-pham'}).catch(e=>toast('Không lưu được: '+e.message,true))}
function clearSample(){if(!canWrite())return;run(async()=>{for(const p of cloud.products)await dbh.collection('products').doc(p.id).delete();for(const d of Array.from(cloud.days.keys()))await dbh.collection('days').doc(d).delete();await dbh.doc('meta/app').set({mode:'real',started:nowIso()});toast('Đã xóa dữ liệu mẫu.')}).catch(e=>toast('Không lưu được: '+e.message,true))}

document.addEventListener('click',e=>{
  document.querySelectorAll('details.mn[open]').forEach(d=>{if(!d.contains(e.target))d.open=false});
  if(e.target.id==='modal'){closeModal();return}
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;if(t.tagName==='TR'&&e.target.closest('.mc'))return;const d=t.dataset;
  switch(d.act){
    case'tk':d.type==='nhap'?openImport():openTicket(d.type);break;case'im-add':im.rows.push({sp:'',name:'',qty:'',total:''});imBody();break;case'im-del':im.rows.splice(+d.i,1);if(!im.rows.length)im.rows.push({sp:'',name:'',qty:'',total:''});imBody();break;case'cnt':openCount();break;case'edit':{const tt=tickets().find(x=>x.pid===d.pid);tt&&tt.loai==='nhap'?openImport(d.pid):openTicket(null,d.pid);break}case'cancel':openCancel(d.pid);break;case'view':viewTicket(d.pid);break;
    case'tk-add':tkAdd(d.id);break;case'tk-addsel':{const ids=[...tk.sel];if(!ids.length){toast('Hãy tick ít nhất một sản phẩm.',true);break}ids.forEach(i=>tkAdd(i,true));tk.sel.clear();tkBody();tkRes($('#tk-q').value);break}case'tk-del':tk.items.splice(+d.i,1);tkBody();break;
    case'st':ui.st=ui.st===d.v?'':d.v;render();break;
    case'row':ui.open.has(d.id)?ui.open.delete(d.id):ui.open.add(d.id);paintX();break;
    case'prod-new':openProd();break;case'prod-edit':openProd(d.id);break;case'del-prod':arm(t,()=>delProd(d.id));break;
    case'more':ui.more+=60;paintJ();break;case'close':closeModal();break;
    case'logout':doLogout();break;case'members':openMembers();break;case'mb-save':saveMember(d.uid);break;case'export':exportData();break;case'ex-copy':exCopy();break;case'ex-dl':exDl();break;case'restore':openRestore();break;case'rs-run':runRestore();break;case'seed':seed();break;case'start-real':startReal();break;case'clear-sample':arm(t,clearSample);break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='tk-q'){e.preventDefault();const l=state.products.filter(p=>norm(p.name).includes(norm(e.target.value)));if(l[0])tkAdd(l[0].id)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='tkf')submitTicket();else if(f.id==='ckf')submitCount();else if(f.id==='imf')submitImport();else if(f.id==='lgf')doLogin(f);else if(f.id==='cxf')submitCancel(f);else if(f.id==='pf')submitProd(f)});
document.addEventListener('input',e=>{const t=e.target,i=t.id;
  if(t.classList&&t.classList.contains('mi')){const dg=t.value.replace(/\D/g,''),f=dg?nf.format(+dg):'';if(f!==t.value){t.value=f;try{t.setSelectionRange(f.length,f.length)}catch(x){}}}
  if(i==='xq'){ui.q=t.value;paintX()}else if(i==='xs'){ui.sort=t.value;paintX()}
  else if(i&&i.indexOf('jf-')===0){ui.f[i.slice(3)]=t.value;ui.more=60;paintJ()}
  else if(im){const r=im.rows[+t.dataset.i];if(t.dataset.f&&r){r[t.dataset.f]=t.value;imPaint()}}
  else if(tk){if(i==='tk-q')tkRes(t.value);else if(t.dataset.pk){t.checked?tk.sel.add(t.dataset.pk):tk.sel.delete(t.dataset.pk);$('#tk-sel').textContent=tk.sel.size}else if(i==='tk-date'){tkPaint();tkRes($('#tk-q').value)}else if(t.dataset.f){const it=tk.items[+t.dataset.i];it[t.dataset.f]=t.dataset.f==='unit'?t.value:t.dataset.f==='gia'?(pn(t.value)||0):+t.value;if(t.dataset.f==='unit'&&tk.type==='nhap'){it.gia=Math.round(prod(it.sp).giaNhap*mult(prod(it.sp),it.unit));tkBody()}else tkPaint()}}
  else if(ck){if(i==='ck-date')ckBody();else ckPaint()}
  else if(i&&i.indexOf('pf-')===0)pfPrev()});
window.addEventListener('hashchange',()=>{ui.more=60;ui.open.clear();closeModal();render();window.scrollTo(0,0)});

const CONFIGURED=/^https:\/\//.test(SUPABASE_URL)&&!/YOUR-/.test(SUPABASE_URL+SUPABASE_PUBLISHABLE_KEY);
let sb=null,sbUid=null,chans=[],pollT=null;const loaders={products:[],days:[],meta:[]};
const BR='<div class="abrand">Quản lý kho<span>ĐĂNG KHOA SPORT</span></div>';
function showAuth(h){$('#auth').innerHTML='<div class="authbox">'+BR+h+'</div>';$('#auth').hidden=false;document.body.classList.add('locked')}
function hideAuth(){$('#auth').hidden=true;$('#auth').innerHTML='';document.body.classList.remove('locked')}
const loginHtml=()=>'<form id="lgf" class="mform" novalidate><h2>Đăng nhập</h2><label class="fld">Email<input id="lg-email" type="email" autocomplete="username"></label><label class="fld">Mật khẩu<input id="lg-pw" type="password" autocomplete="current-password"></label><div class="err" id="lg-err" role="alert"></div><button class="btn sell" type="submit" id="lg-btn">Đăng nhập</button><p class="muted">Tài khoản do quản trị viên cấp. Liên hệ quản trị viên nếu bạn chưa có tài khoản hoặc quên mật khẩu.</p></form>';
const blockedHtml=m=>'<h2>Chưa thể truy cập</h2><p>'+esc(m)+'</p><button class="btn" data-act="logout">Đăng xuất</button>';
async function doLogin(f){const em=$('#lg-email').value.trim(),pw=$('#lg-pw').value,er=$('#lg-err'),b=$('#lg-btn');
  if(!em||!pw){er.textContent='Nhập email và mật khẩu.';return}
  b.disabled=true;er.textContent='';
  const{error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){er.textContent='Email hoặc mật khẩu không đúng.';b.disabled=false}}
async function doLogout(){if(sb)await sb.auth.signOut();else{teardown();showAuth(loginHtml())}}
function teardown(){chans.forEach(c=>{try{sb.removeChannel(c)}catch(e){}});chans=[];clearInterval(pollT);clearTimeout(timer);loaders.products=[];loaders.days=[];loaders.meta=[];
  dbh=null;sbUid=null;cloud.products=[];cloud.days=new Map();cloud.meta=undefined;cloud.got={p:false,d:false,m:false};
  Object.assign(state,{products:[],days:new Map(),lines:[],source:'demo',conn:'offline',meta:null,userCan:undefined,admin:false,uname:'',ready:false,memberCanEdit:false,me:null});closeModal();$('#who').innerHTML='';$('#main').innerHTML='';$('#nav').innerHTML=''}
function apply(){if(!(cloud.got.p&&cloud.got.d&&cloud.got.m))return;clearTimeout(timer);state.ready=true;state.conn='online';state.meta=cloud.meta||null;
  if(!cloud.meta&&!cloud.products.length&&!cloud.days.size)setDemo();else{state.source='cloud';state.products=cloud.products.slice().sort((a,b)=>a.name.localeCompare(b.name,'vi'));state.days=cloud.days;rebuild()}
  if(!tk&&!ck&&!im&&$('#modal').hidden)render()}
const refetch=n=>(loaders[n]||[]).forEach(f=>f());
function makeDb(){
  const up=async(t,id,d)=>{const{error}=await sb.from(t).upsert({id,data:d});if(error)throw new Error(error.message||'Lỗi lưu dữ liệu');refetch(t)};
  const del=async(t,id)=>{const{error}=await sb.from(t).delete().eq('id',id);if(error)throw new Error(error.message||'Lỗi xóa dữ liệu');refetch(t)};
  const watch=(t,cb,fail,single)=>{const load=async()=>{const{data,error}=await sb.from(t).select('id,data');if(error){fail&&fail(error);return}
      cb(single?{exists:data.some(x=>x.id==='app'),data:()=>(data.find(x=>x.id==='app')||{}).data}:{docs:data.map(x=>({id:x.id,data:()=>x.data}))})};
    loaders[t].push(load);load();chans.push(sb.channel('kho-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},load).subscribe())};
  return{collection:t=>({doc:id=>({set:d=>up(t,id,d),delete:()=>del(t,id)}),onSnapshot:(cb,fail)=>watch(t,cb,fail,false)}),doc:()=>({set:d=>up('meta','app',d),onSnapshot:(cb,fail)=>watch('meta',cb,fail,true)})}}
async function startSession(session){
  if(sbUid===session.user.id&&dbh)return;sbUid=session.user.id;
  showAuth('<p class="muted">Đang kiểm tra quyền truy cập…</p>');
  const{data:m,error}=await sb.from('members').select('*').eq('user_id',sbUid).maybeSingle();
  if(error){showAuth(blockedHtml('Không đọc được danh sách thành viên: '+error.message));return}
  if(!m||!m.active){showAuth(blockedHtml(m?'Tài khoản của bạn chưa được kích hoạt. Hãy liên hệ quản trị viên.':'Tài khoản chưa có trong danh sách thành viên. Hãy liên hệ quản trị viên.'));return}
  Object.assign(state,{me:m,admin:m.role==='admin',uname:m.display_name||session.user.email,userCan:true,memberCanEdit:m.can_edit!==false});
  hideAuth();dbh=makeDb();state.conn='connecting';renderNav(route());$('#main').innerHTML='<p class="note">Đang tải dữ liệu…</p>';
  timer=setTimeout(()=>{if(!state.ready){state.conn='slow';render()}},10000);
  const fail=()=>{state.conn='error';render()};
  dbh.collection('products').onSnapshot(s=>{cloud.products=s.docs.map(d=>Object.assign({id:d.id},d.data()));cloud.got.p=true;apply()},fail);
  dbh.collection('days').onSnapshot(s=>{const mm=new Map();s.docs.forEach(d=>{const x=d.data();mm.set(d.id,Array.isArray(x.lines)?x.lines:[])});cloud.days=mm;cloud.got.d=true;apply()},fail);
  dbh.doc('meta/app').onSnapshot(s=>{cloud.meta=s.exists?s.data():undefined;cloud.got.m=true;apply()},fail);
  pollT=setInterval(()=>['products','days','meta'].forEach(refetch),45000)}
function renderWho(){const w=$('#who');if(!w)return;if(!state.me){w.innerHTML='';return}
  w.innerHTML='<div class="who"><div><b>'+esc(state.uname)+'</b><small>'+(state.admin?'Quản trị viên':'Nhân viên')+'</small></div><button class="btn sm" data-act="logout">Đăng xuất</button>'+(state.admin?'<button class="btn sm" data-act="members">Quản lý thành viên</button><button class="btn sm" data-act="export">Xuất dữ liệu</button><button class="btn sm" data-act="restore">Nhập dữ liệu</button>':'')+'</div>'}

  showModal('<h2>Quản lý thành viên</h2><p class="muted">Tạo tài khoản mới trong Supabase (Authentication → Users → Add user), sau đó quay lại đây để kích hoạt, đặt tên hiển thị và vai trò.</p><div class="scroll"><table class="mt plain"><thead><tr><th class="l">Email</th><th class="l">Tên hiển thị</th><th class="l">Vai trò</th><th>Được sửa phiếu</th><th>Hoạt động</th><th></th></tr></thead><tbody>'+
   data.map(m=>{const me=m.user_id===sbUid;return'<tr data-uid="'+esc(m.user_id)+'"><td class="l">'+esc(m.email)+(m.active?'':' <span class="pill low">Chờ kích hoạt</span>')+'</td><td class="l"><input type="text" data-k="name" maxlength="40" value="'+esc(m.display_name)+'"></td><td class="l"><select data-k="role"'+(me?' disabled':'')+'><option value="staff"'+(m.role==='staff'?' selected':'')+'>Nhân viên</option><option value="admin"'+(m.role==='admin'?' selected':'')+'>Quản trị viên</option></select></td><td><input type="checkbox" data-k="edit"'+(m.can_edit?' checked':'')+'></td><td><input type="checkbox" data-k="active"'+(m.active?' checked':'')+(me?' disabled':'')+'></td><td><button class="btn sm" data-act="mb-save" data-uid="'+esc(m.user_id)+'">Lưu</button></td></tr>'}).join('')+'</tbody></table></div><div class="mact"><button class="btn" data-act="close">Đóng</button></div>')}
async function saveMember(uid){const tr=document.querySelector('#modal tr[data-uid="'+uid+'"]');if(!tr)return;const g=k=>tr.querySelector('[data-k="'+k+'"]');

function openRestore(){if(!state.admin)return;
  showModal('<h2>Nhập dữ liệu từ file JSON</h2><p class="muted">Dùng file xuất từ bản Claude cũ (hoặc từ chính app này). Mã sản phẩm và ngày trùng sẽ bị ghi đè; dữ liệu khác được giữ nguyên.</p><input type="file" id="rs-file" accept=".json,application/json"><textarea id="rs-t" rows="7" placeholder="…hoặc dán nội dung JSON vào đây" style="width:100%;font:12px monospace;border:1px solid #c5d1db;border-radius:8px;padding:8px;margin-top:8px"></textarea><label class="chk" style="margin-top:8px"><input type="checkbox" id="rs-ok"> Tôi hiểu dữ liệu trùng mã sẽ bị ghi đè</label><div class="err" id="rs-err" role="alert"></div><div class="mact"><button class="btn" data-act="close">Hủy</button><button class="btn in" data-act="rs-run">Nhập dữ liệu</button></div>');
  $('#rs-file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#rs-t').value=String(r.result)};r.readAsText(f)})}
async function runRestore(){const er=$('#rs-err');er.textContent='';let o;
  try{o=JSON.parse($('#rs-t').value)}catch(e){er.textContent='Nội dung không phải JSON hợp lệ.';return}
  if(!o||!Array.isArray(o.products)||!Array.isArray(o.days)){er.textContent='File không đúng định dạng (cần có "products" và "days").';return}
  if(o.products.some(p=>!p||typeof p.id!=='string'||!p.name)){er.textContent='Có sản phẩm thiếu mã hoặc tên.';return}
  if(o.days.some(d=>!d||!/^\d{4}-\d{2}-\d{2}$/.test(d.id)||!Array.isArray(d.lines))){er.textContent='Có ngày giao dịch sai định dạng.';return}
  if(!$('#rs-ok').checked){er.textContent='Hãy tick xác nhận trước khi nhập.';return}
  const pr=o.products.map(p=>{const d=Object.assign({},p);delete d.id;return{id:p.id,data:d}}),dr=o.days.map(d=>({id:d.id,data:{d:d.id,lines:d.lines}}));
  try{for(const[t,rows]of[['products',pr],['days',dr]])for(let i=0;i<rows.length;i+=100){const{error}=await sb.from(t).upsert(rows.slice(i,i+100));if(error)throw error}
    if(o.meta){const{error}=await sb.from('meta').upsert({id:'app',data:o.meta});if(error)throw error}
    ['products','days','meta'].forEach(refetch);closeModal();toast('Đã nhập '+pr.length+' sản phẩm và '+dr.length+' ngày giao dịch.')}
  catch(e){er.textContent='Không nhập được: '+(e.message||'lỗi không rõ')}}
async function init(){
  if(!CONFIGURED){showAuth('<h2>Chưa cấu hình</h2><p>Mở file <b>index.html</b>, điền <b>SUPABASE_URL</b> và <b>SUPABASE_PUBLISHABLE_KEY</b> ở đầu phần script (xem HUONG_DAN.md).</p>');return}
  if(!window.supabase){showAuth('<p class="err">Không tải được thư viện Supabase. Kiểm tra kết nối mạng rồi tải lại trang.</p>');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_OUT'){teardown();showAuth(loginHtml())}else if(sess&&ev==='SIGNED_IN')setTimeout(()=>startSession(sess),0)});
  const{data:{session}}=await sb.auth.getSession();
  if(session)startSession(session);else showAuth(loginHtml())}
init();
})();
</script></body></html>
